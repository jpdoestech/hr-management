name: Deploy Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:
    inputs:
      baseline_existing_database:
        description: "Mark migrations 0001-0029 as already applied. Use once only when the existing database already has every legacy phase through Phase 32."
        required: true
        default: false
        type: boolean

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.SUPABASE_MIGRATIONS_BASELINED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Missing SUPABASE_PROJECT_REF"; exit 1; }

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Baseline existing production schema
        if: ${{ inputs.baseline_existing_database == true }}
        shell: bash
        run: |
          for file in supabase/migrations/*.sql; do
            version="$(basename "$file" | cut -d_ -f1)"
            if (( 10#$version <= 29 )); then
              supabase migration repair "$version" --status applied --linked --password "$SUPABASE_DB_PASSWORD"
            fi
          done

      - name: Apply pending migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
